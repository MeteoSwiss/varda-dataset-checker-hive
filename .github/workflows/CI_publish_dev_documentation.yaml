# This workflow will build and publish the `dev` documentation to the `gh-pages` branch of the
# repository when pushing to the main branch.
# It uses the `peaceiris/actions-gh-pages` action to handle the GitHub pages publishing.
#
# Copyright (c) 2025 MeteoSwiss

name: CI_publish_dev_documentation

on:
  workflow_run:
    workflows: ["CI_test"]
    branches: ['main']
    types:
      - completed

jobs:

  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@v6
      with:
        python-version: 3.12

    - name: Install python package
      run: uv sync --locked

    - name: Build documentation
      env:
        VERSION: dev
        GITHUB_SHA: ${{ github.sha }}
      # Set the buildId to the first 7 digits of the commit hash
      run: BUILD_ID=$(echo ${GITHUB_SHA::7}) uv run sphinx-build doc doc/_build

    - name: Publish documentation
      uses: peaceiris/actions-gh-pages@v3

      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/
        keep_files: true
