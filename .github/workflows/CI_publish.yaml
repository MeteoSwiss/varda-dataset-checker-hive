# This workflow will build and publish the Python package to PyPi when a new tag is added.
# It uses `pypa/gh-action-pypi-publish@release/v1` to publish to pypi using trusted publishers feature.
#
# Copyright (c) 2025 MeteoSwiss, created by Michele Cattaneo; michele.cattaneo@meteoswiss.ch

name: CI_publish

on:
  push:
    tags: '**'

jobs:

  tests:
    uses: ./.github/workflows/CI_test.yaml

  publish:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@v6
      with:
        python-version: 3.12

    - name: Install python package
      run: uv sync --locked

    - name: Build artifacts
      run: |
        uv version --frozen ${GITHUB_REF#refs/tags/}
        uv build

    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
