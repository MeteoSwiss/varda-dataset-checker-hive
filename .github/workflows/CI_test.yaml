name: CI_test

on:
  pull_request:
    branches: '**'
  push:
    branches: ['main']
  workflow_call:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']


    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4


    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked

    - name: Build documentation
      run: uv run sphinx-build doc doc/_build

    - name: Run pytest
      run: uv run pytest -s --cov=varda_hive --cov-fail-under=80

    - name: Run linter
      run: uv run pylint -rn --output-format=parseable src/varda_hive

    - name: Run static checker
      run: |
        OUTPUT=$(uv run mypy src/varda_hive 2>&1 || true)
        echo "$OUTPUT"

        # Extract the error count from lines
        COUNT=$(echo "$OUTPUT" | grep -Po 'Found \K[0-9]+(?= errors?)' || echo 0)
        echo "Found $COUNT mypy errors"

        MAX_ERRORS=5
        if [ "$COUNT" -gt "$MAX_ERRORS" ]; then
          echo "$COUNT/$MAX_ERRORS mypy errors found."
          exit 1
        else
          exit 0
        fi
