[project]
name = "varda-dataset-checker-hive"
version = "0.1.0"
description = "A hive of slim bees that check anemoi datasets for faults: metadata, statistics and spot-checks against the source."
license = "BSD-3-Clause"
readme = "README.md"
authors = [{ name = "Daniel Hupp", email = "daniel.hupp@meteoswiss.ch" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "zarr>=2.18,<3",
]

[project.optional-dependencies]
anemoi = ["anemoi-datasets>=0.5.42"]

[project.scripts]
hive = "varda_hive.cli:hive_main"
meta-bee = "varda_hive.cli:meta_bee_main"
stats-bee = "varda_hive.cli:stats_bee_main"
spot-bee = "varda_hive.cli:spot_bee_main"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=7",
]
lint = [
    "mypy>=1.18",
    "pylint>=3.3",
    "yapf>=0.43",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varda_hive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not faulty'"
markers = ["faulty: runs on the Varda-tiny faulty datasets on /scratch (skipped when missing)"]

[tool.yapf]
based_on_style = "pep8"
column_limit = "120"

[tool.pylint.master]
disable = [
    'C0114', # missing-module-docstring
    'C0115', # missing-class-docstring
    'C0116', # missing-function-docstring
    'W0511', # fix me or to-do comments are already covered by SonarQube
]

[tool.pylint.basic]
argument-naming-style = 'any'
attr-naming-style = 'any'

[tool.pylint.format]
# Maximum number of lines in a module.
max-line-length = 120

[tool.pylint.design]
# Minimum number of public methods for a class (see R0903).
min-public-methods = 0

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.coverage.run]
omit = ["tests/**"]
