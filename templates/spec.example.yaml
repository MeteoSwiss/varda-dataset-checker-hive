# Example dataset spec for varda-dataset-checker-hive.
# Copy this into the dataset's own repo (e.g. checks/<dataset>.yaml) and adapt, see
# "Setting up a dataset" in the README. Every field is optional: checks that need a missing
# field report "skipped" (an error with --strict). Unknown keys are rejected, so typos fail
# loudly, and files named here must exist.

name: varda-kenda-ch1-2km-2020-2020-1h-v1.0-pl13-test

# meta-bee: expected structure, from the anemoi recipe (consistency checks need nothing)
variables: [T_2M, U_10M, V_10M, T_850]       # exact set of variables
start_date: 2020-03-01T00:00:00
end_date: 2020-03-30T23:00:00
frequency: 1h
grid_points: 30676
resolution: 2km                              # the `resolution` attribute
bbox: {lat_min: 45.43, lat_max: 48.19, lon_min: 5.25, lon_max: 11.03, tolerance: 0.01}   # grid extent, degrees
allow_nans: false
missing_dates: []                            # dates the dataset may list as missing
constant_fields: [FIS, FR_LAND]
# meta-bee: expected mars param/levtype/levelist per variable, see variables.example.yaml
variables_file: variables.yaml
# meta-bee: reference of the accepted version, to compare metadata and structure with. Uncomment
# once written with `meta-bee dump data.zarr -o <dataset>.meta.yaml`, committed next to this spec
# (a path to a zarr works too).
# reference_meta: <dataset>.meta.yaml
# meta-bee: change the severity of differences to the reference (globs on the dotted path, see
# `meta-bee compare --all`). Defaults: structure ERROR, other metadata WARNING, churn ignored.
reference_policy:
  ignore: [variables_metadata.*.mars.date]   # the build date of each field
  error: []
  warning: []
  info: []

# stats-bee: physical ranges per variable (path relative to this file)
ranges_file: physical_ranges.yaml
# stats-bee: stats file of the accepted version to compare against. Uncomment once written with
# `stats-bee dump data.zarr --spec <this file> -o <dataset>.stats.yaml`, committed next to this spec.
# reference_stats: <dataset>.stats.yaml
# stats-bee: calibrated tolerances for statistics_consistent. Uncomment once written with
# `stats-bee calibrate data.zarr --spec <this file> -o <dataset>.tolerances.yaml`; recalibrate when `sampling` changes.
# calibrated_tolerances: <dataset>.tolerances.yaml

# Seeded sampling used by stats-bee and spot-bee
sampling:
  seed: 0
  n_dates: 20           # random dates over the whole time range, or "all"
  n_points: 10000       # grid points for mean/stdev per date (min/max/NaN always full domain), or "all"
  include_dates: []     # time indices always checked in addition

tolerances:
  statistics_rtol: 1.0e-5   # recomputed vs stored statistics: floating-point part
  z_threshold: 5.0          #   ... plus z_threshold * sampling error (0 for n_dates: all)
  compare_atol_stdev: 0.0   # stats file vs reference: "close" within this * stdev, else "differs"
  source_rtol: 1.0e-4       # spot-bee: dataset vs source values, |diff| <= atol + rtol * |source|
  source_atol: 1.0e-4
  source_per_variable: {}   # overrides, e.g. {TOT_PREC_1H: {atol: 1.0e-6}}

# Accepted warnings, demoted to INFO: {check: [variables]}, "*" for all variables
ignore_warnings:
  statistics_consistent: [insolation]   # diurnal field, a small sample can't resolve its mean

# spot-bee: where the original values come from. "file.py:Class" (relative to
# this file) or "package.module:Class"; `args` are passed to the constructor.
# Uncomment and adapt, see docs/spot-bee.md (needs the `grib` extra).
# source:
#   plugin: varda_hive.sources.grib_index:GribIndexSource
#   args:
#     root: /path/to/dataset-repo           # base of the index paths and of the GRIB paths in them
#     indexes: {ana: grib-index-ana.db, fg: grib-index-fg.db}
#     default_index: ana
#     variables:                            # overrides of the mapping from variables_metadata.mars
#       TOT_PREC_1H: {index: fg, match: {shortName: TOT_PREC}, scale: 0.001}
#     skip: {TOT_PREC_6H: 6 h accumulation}
# or another anemoi zarr, e.g. a trusted copy (templates/source_plugin_example.py):
#   plugin: source_plugin_example.py:ZarrSource
#   args: {path: /path/to/reference.zarr}
